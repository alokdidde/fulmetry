name: release

# The downloadable app. Every merge to main (docs-only ones aside) builds Fulmetry.app for Apple silicon and the
# Linux x86_64 tarball and publishes both as a GitHub release, v0.1.<run number>, tagged at the merged commit.
# A pull request that touches the packaging builds them too, as workflow artifacts: nothing is released.
# A manual run on main releases like a merge; on another branch it only builds.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/package/**"
      - "tools/deps.json"
      - "tools/fetch_dep.py"
      - "app/viewport/**"
      - "app/ui/raven/main.cpp"
      - "CMakePresets.json"
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time; on main, releases go out in merge order.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: Fulmetry.app (macOS, Apple silicon)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "version=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else echo "version=v0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        run: brew install molten-vk ninja
      - name: Locate dependencies
        id: dep
        run: |
          deps=$(cd "$GITHUB_WORKSPACE/.." && pwd)/deps
          echo "WICKED_ROOT=$deps/wicked" >> "$GITHUB_ENV"
          echo "RAVEN_GUI_ROOT=$deps/raven" >> "$GITHUB_ENV"
          echo "MUJOCO_ROOT=$deps/mujoco" >> "$GITHUB_ENV"
          echo "FULMETRY_WICKED_SHADER_CACHE=$deps/wicked-shader-cache" >> "$GITHUB_ENV"
          echo "key=$(python3 tools/fetch_dep.py key wicked)" >> "$GITHUB_OUTPUT"
      - name: Restore Wicked build
        uses: actions/cache@v4
        with:
          path: build/release/app/viewport/wicked/xcode
          key: macos-${{ steps.dep.outputs.key }}-xcode-v2
      - name: Restore shader cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FULMETRY_WICKED_SHADER_CACHE }}
          key: macos-${{ steps.dep.outputs.key }}-shaders-v1
      - name: Fetch Wicked Engine, Raven and MuJoCo
        run: |
          python3 tools/fetch_dep.py fetch wicked "$WICKED_ROOT"
          python3 tools/fetch_dep.py fetch raven "$RAVEN_GUI_ROOT"
          python3 tools/fetch_dep.py fetch mujoco-macos "$MUJOCO_ROOT"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: GPU
        run: system_profiler SPDisplaysDataType | head -20
      - name: Metal shaders compile
        # The live stage compiles Wicked's shaders for Metal on first launch. The runner's GPU can't run them, but the
        # compiler (DXC, then the Metal shader converter) runs on the CPU, so compile all of them here and ship them
        # in the app (tools/package/macos.sh): the app then never compiles shaders on the user's Mac.
        run: |
          w="$WICKED_ROOT/WickedEngine"
          out="$GITHUB_WORKSPACE/build/release/metal-shaders"
          mkdir -p "$out"
          cp "$w/libdxcompiler.dylib" "$w/libmetalirconverter.dylib" "$out/"
          clang++ -std=gnu++20 -O1 -w -DJPH_DEBUG_RENDERER -I"$w" -I"$w/Utility/metal" "$w/offlineshadercompiler.cpp" \
            build/release/app/viewport/wicked/xcode/Build/Products/Release/libWickedEngine_MacOS.a \
            -framework Metal -framework MetalKit -framework MetalFX -framework QuartzCore -framework Foundation \
            -framework AppKit -framework GameController -framework IOKit -framework CoreHaptics -framework AudioToolbox \
            -framework CoreAudio -framework AVFoundation -framework UniformTypeIdentifiers -o "$out/offlineshadercompiler"
          cd "$out"
          ./offlineshadercompiler metal > compile.log 2>&1 || { grep -iE "error|fail" compile.log | head -80; exit 1; }
          tail -3 compile.log
          n=$(find shaders/metal -name "*.cso" | wc -l | tr -d " ")
          echo "compiled $n Metal shaders"
          test "$n" -ge 300
      - name: Smoke run (null window)
        timeout-minutes: 25
        # The UI runs on Raven's null backend. Wicked's Metal backend needs Metal 4, which the hosted runners' virtual
        # GPU lacks, so here the app takes its still-stage fallback; on a Metal 4 Mac the live stage and Simulate run.
        run: |
          build/release/app/ui/fulmetry_workbench --headless --strict --project sample --frames 30 --simulate --sim-seconds 3 | tee smoke.log
          grep -q "workbench ready" smoke.log
          grep -Eq "stage: (Wicked|still image)" smoke.log
          if grep -q "stage: Wicked" smoke.log; then grep -q "simulate: t 3.00 s" smoke.log; fi
      # T3 Code runs the coding agents: its server (the fork in agent/t3code, `t3 fulmetry`) and the Node.js it needs
      # ship inside the app, so a plain download talks to real agents with nothing else installed.
      - name: T3 Code checkout
        run: git submodule update --init --depth 1 agent/t3code
      - uses: actions/setup-node@v4
        with:
          node-version-file: agent/t3code/package.json
      - name: T3 Code server
        working-directory: agent/t3code
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter "t3..." --filter t3code
          (cd apps/server && pnpm exec vp pack)
          node "$GITHUB_WORKSPACE/tools/package/t3-stage.mjs" . "$GITHUB_WORKSPACE/build/release/t3"
          echo "T3_STAGE=$GITHUB_WORKSPACE/build/release/t3" >> "$GITHUB_ENV"
          echo "NODE_BIN=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - name: Signing certificate
        # Developer ID signing and notarization run once the MACOS_CERT_* and NOTARY_* secrets exist (an Apple Developer
        # Program account). Without them, or on a pull request, the app is signed ad hoc and Gatekeeper warns on first open.
        id: sign
        if: github.event_name != 'pull_request'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "no MACOS_CERT_P12 secret: signing ad hoc"; exit 0; fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          kp=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$id" || { echo "the certificate is not a Developer ID Application certificate" >&2; exit 1; }
          echo "identity=$id" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: tools/package/macos.sh build/release dist "${{ steps.v.outputs.version }}"
      - name: Bundled T3 Code starts
        run: |
          r=dist/Fulmetry.app/Contents/Resources
          home=$(mktemp -d)
          (sleep 40) | "$r/node/bin/node" "$r/t3/bin.mjs" fulmetry --base-dir "$home" > t3-smoke.log 2> t3-smoke.err &
          for _ in $(seq 1 60); do grep -q '"fulmetry.ready"' t3-smoke.log && break; sleep 1; done
          grep -q '"fulmetry.ready"' t3-smoke.log || { tail -40 t3-smoke.err; exit 1; }
          echo "the bundled T3 Code bridge is ready"
      - name: Notarize
        if: steps.sign.outputs.identity != ''
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          zip=$(ls dist/*.zip)
          xcrun notarytool submit "$zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m --output-format json | tee notary.json
          grep -q '"status" *: *"Accepted"' notary.json || {
            xcrun notarytool log "$(python3 -c 'import json;print(json.load(open("notary.json"))["id"])')" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER"; exit 1; }
          rm "$RUNNER_TEMP/notary.p8"
          # Staple the ticket so the first open works offline, then zip the stapled app again.
          xcrun stapler staple dist/Fulmetry.app
          spctl --assess --type execute -vv dist/Fulmetry.app
          rm "$zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Fulmetry.app "$zip"
      - name: Screenshot of the packaged app
        # A real window through MoltenVK on the runner's desktop. Best effort: some runners have no display.
        continue-on-error: true
        run: |
          mkdir -p shots
          dist/Fulmetry.app/Contents/MacOS/Fulmetry --project sample --frames 40 --strict --shot "$PWD/shots/macos-app.png"
          dist/Fulmetry.app/Contents/MacOS/Fulmetry --project sample --frames 40 --strict --simulate --sim-seconds 7.3 \
            --shot "$PWD/shots/macos-simulate.png"
      - uses: actions/upload-artifact@v4
        with:
          name: fulmetry-macos-arm64
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: shots/
          if-no-files-found: ignore

  linux:
    name: Linux x86_64 tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "version=v0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else echo "version=v0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers ninja-build libx11-dev patchelf
      - name: Locate dependencies
        id: dep
        run: |
          deps=$(realpath -m "$GITHUB_WORKSPACE/../deps")
          echo "WICKED_ROOT=$deps/wicked" >> "$GITHUB_ENV"
          echo "RAVEN_GUI_ROOT=$deps/raven" >> "$GITHUB_ENV"
          echo "MUJOCO_ROOT=$deps/mujoco" >> "$GITHUB_ENV"
          echo "FULMETRY_WICKED_SHADER_CACHE=$deps/wicked-shader-cache" >> "$GITHUB_ENV"
          echo "key=$(python3 tools/fetch_dep.py key wicked)" >> "$GITHUB_OUTPUT"
      - name: Restore Wicked build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WICKED_ROOT }}
            build/release
          key: linux-${{ steps.dep.outputs.key }}-release-v1
      - name: Fetch Wicked Engine, Raven and MuJoCo
        run: |
          python3 tools/fetch_dep.py fetch wicked "$WICKED_ROOT"
          python3 tools/fetch_dep.py fetch raven "$RAVEN_GUI_ROOT"
          python3 tools/fetch_dep.py fetch mujoco "$MUJOCO_ROOT"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Package
        run: tools/package/linux.sh build/release dist "${{ steps.v.outputs.version }}"
      - name: Smoke run of the package
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/*.tar.gz
          "$RUNNER_TEMP"/fulmetry-*/fulmetry --headless --strict --project sample --frames 30 --simulate --sim-seconds 3 | tee smoke.log
          grep -q "stage: Wicked" smoke.log
          grep -q "simulate: t 3.00 s" smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: fulmetry-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: fulmetry-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Fulmetry $tag" \
            --notes-file tools/package/RELEASE_NOTES.md --prerelease
