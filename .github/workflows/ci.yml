name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Stream stays in its directories
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed.txt
          python3 tools/check_ownership.py "${{ github.head_ref }}" $(cat changed.txt)

  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (AppleClang, arm64): the one runner where the compiler may fuse
        # multiply-adds, so it is the main check that golden-image tolerances are not too tight.
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Default shells on purpose: under bash on Windows, Git's /usr/bin/link can shadow MSVC's link.exe.
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Toolchain
        run: cmake --version && ninja --version
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        # The ci test preset already prints output on failure and errors when no tests are found.
        run: ctest --preset ci --output-on-failure
      - name: Upload golden-image diffs
        # fulmetry_add_golden_test copies actual.png, golden.png and diff.png of each failing test here.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: |
            build/ci/golden-diffs/
            build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  occt:
    # S3's real CAD kernel against Ubuntu's OpenCASCADE packages (vcpkg is only used by the full preset).
    name: app (ubuntu-24.04, OCCT)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev libtbb-dev ninja-build
      - name: Configure
        run: cmake -S . -B build/occt -G Ninja -DFULMETRY_WITH_OCCT=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/occt
      - name: Test
        run: ctest --test-dir build/occt --output-on-failure
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-occt
          path: |
            build/occt/golden-diffs/
            build/occt/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e 'worker[test]'
      - name: Test
        working-directory: worker
        run: pytest -q

  worker-cad:
    # The worker with S8's optional build123d `cad` extra.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install
        run: pip install -e 'worker[test,cad]'
      - name: Test
        working-directory: worker
        run: pytest -q

  maker-tools:
    # S9's TypeScript MCP toolkit. A no-op until agent/maker-tools/package.json is on the branch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Detect
        id: detect
        run: |
          if [ -f agent/maker-tools/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            # pnpm/action-setup refuses a version input when package.json pins one in packageManager.
            if grep -q '"packageManager"' agent/maker-tools/package.json; then
              echo "pnpm=" >> "$GITHUB_OUTPUT"
            else
              echo "pnpm=9" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent/maker-tools/package.json not found; skipping maker-tools"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: ${{ steps.detect.outputs.pnpm }}
          package_json_file: agent/maker-tools/package.json
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent/maker-tools/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with: { python-version: "3.12" }
      - name: Install worker
        if: steps.detect.outputs.present == 'true'
        run: pip install -e 'worker[test]'
      - name: Build and test
        if: steps.detect.outputs.present == 'true'
        working-directory: agent/maker-tools
        run: pnpm install --frozen-lockfile && pnpm build && pnpm test
