name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # runs every job, path-filtered ones included

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path filter for the heavy engine jobs (wicked, raven-gui): they run on PRs that touch their paths, and always
    # on pushes to main and manual runs. Main's runs also save the caches that PR runs restore from.
    runs-on: ubuntu-24.04
    outputs:
      wicked: ${{ steps.filter.outputs.wicked }}
      raven: ${{ steps.filter.outputs.raven }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with: { fetch-depth: 0 }
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          # Shared by both: what the modules link or test against, the root build, the pins and this workflow.
          SHARED: '^(app/(core|project|shell|tests)/|CMakeLists\.txt$|CMakePresets\.json$|tools/(deps\.json|fetch_dep\.py|cmake/)|\.github/workflows/ci\.yml$)'
          # The Wicked job also builds and runs the M1 workbench (Raven GUI with the live Wicked stage).
          WICKED: '^(app/viewport/|app/ui/|app/sim/|fixtures/rover/)'
          RAVEN: '^app/ui/'
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "wicked=true" >> "$GITHUB_OUTPUT"
            echo "raven=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/$BASE...HEAD" > changed.txt
          match() { if grep -qE -e "$SHARED" -e "$1" changed.txt; then echo true; else echo false; fi; }
          echo "wicked=$(match "$WICKED")" | tee -a "$GITHUB_OUTPUT"
          echo "raven=$(match "$RAVEN")" | tee -a "$GITHUB_OUTPUT"

  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Stream stays in its directories
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}  # branch names are untrusted input: never inline them in the script
        run: |
          git diff --name-only "origin/$BASE...HEAD" > changed.txt
          # shellcheck disable=SC2046  # one argument per changed path (paths have no spaces)
          python3 tools/check_ownership.py "$HEAD_REF" $(cat changed.txt)

  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (AppleClang, arm64): the one runner where the compiler may fuse
        # multiply-adds, so it is the main check that golden-image tolerances are not too tight.
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Default shells on purpose: under bash on Windows, Git's /usr/bin/link can shadow MSVC's link.exe.
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Toolchain
        run: cmake --version && ninja --version
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        # The ci test preset already prints output on failure and errors when no tests are found.
        run: ctest --preset ci --output-on-failure
      - name: Upload golden-image diffs
        # fulmetry_add_golden_test copies actual.png, golden.png and diff.png of each failing test here.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: |
            build/ci/golden-diffs/
            build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  occt:
    # S3's real CAD kernel against Ubuntu's OpenCASCADE packages (vcpkg is only used by the full preset).
    name: app (ubuntu-24.04, OCCT)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev libtbb-dev ninja-build
      - name: Configure
        run: cmake -S . -B build/occt -G Ninja -DFULMETRY_WITH_OCCT=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build/occt
      - name: Test
        run: ctest --test-dir build/occt --output-on-failure
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-occt
          path: |
            build/occt/golden-diffs/
            build/occt/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -e 'worker[test]'
      - name: Test
        working-directory: worker
        run: pytest -q

  worker-cad:
    # The worker with S8's optional build123d `cad` extra.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install
        run: pip install -e 'worker[test,cad]'
      - name: Test
        working-directory: worker
        run: pytest -q

  maker-tools:
    # S9's TypeScript MCP toolkit. A no-op until agent/maker-tools/package.json is on the branch.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Detect
        id: detect
        run: |
          if [ -f agent/maker-tools/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            # pnpm/action-setup refuses a version input when package.json pins one in packageManager.
            if grep -q '"packageManager"' agent/maker-tools/package.json; then
              echo "pnpm=" >> "$GITHUB_OUTPUT"
            else
              echo "pnpm=9" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent/maker-tools/package.json not found; skipping maker-tools"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: ${{ steps.detect.outputs.pnpm }}
          package_json_file: agent/maker-tools/package.json
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent/maker-tools/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with: { python-version: "3.12" }
      - name: Install worker
        if: steps.detect.outputs.present == 'true'
        run: pip install -e 'worker[test]'
      - name: Build and test
        if: steps.detect.outputs.present == 'true'
        working-directory: agent/maker-tools
        run: pnpm install --frozen-lockfile && pnpm build && pnpm test

  provider-raven:
    # S7's T3 Code provider for Raven (TypeScript; vitest drives a scripted `raven acp`). About a minute.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent/provider-raven
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # pnpm version from packageManager in package.json
        with:
          package_json_file: agent/provider-raven/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent/provider-raven/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  # The engine jobs keep pinned dependencies in <workspace>/../deps (outside the repo checkout, at a fixed absolute
  # path, which the cached Wicked build dir relies on). Pins: tools/deps.json, fetched by tools/fetch_dep.py.
  mujoco:
    # S4's MujocoSimulation on the official MuJoCo release. Cheap (14 MB cached download, ~30 build steps), so it
    # runs on every PR.
    name: app (ubuntu-24.04, MuJoCo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Locate dependencies
        id: dep
        run: |
          echo "MUJOCO_ROOT=$(realpath -m "$GITHUB_WORKSPACE/../deps/mujoco")" >> "$GITHUB_ENV"
          echo "key=$(python3 tools/fetch_dep.py key mujoco)-linux-x86_64" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ env.MUJOCO_ROOT }}
          key: ${{ steps.dep.outputs.key }}
      - name: Fetch MuJoCo
        run: python3 tools/fetch_dep.py fetch mujoco "$MUJOCO_ROOT"
      - name: Configure
        run: cmake --preset ci-mujoco
      - name: Build
        run: cmake --build --preset ci-mujoco
      - name: Test
        run: ctest --preset ci-mujoco

  wicked:
    # S2's WickedViewport: Wicked Engine plus app/viewport/wicked/patches, rendered headless on Mesa lavapipe.
    # Cold: ~15 min engine build and ~50 s of shader compiles. Both are cached, keyed on the pin plus the patch
    # hash, so a warm run rebuilds only our own sources.
    # Preset ci-m1 = ci-wicked plus Raven GUI: it also builds the M1 workbench (fulmetry_workbench with the live
    # Wicked stage), runs every ctest, then app/ui/tests/m1_shots.sh under Xvfb and uploads the M1 screenshots.
    name: app (ubuntu-24.04, Wicked)
    needs: changes
    if: needs.changes.outputs.wicked == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers ninja-build \
            libx11-dev xvfb xauth xdotool imagemagick
      - name: Locate dependencies
        id: dep
        run: |
          deps=$(realpath -m "$GITHUB_WORKSPACE/../deps")
          echo "WICKED_ROOT=$deps/wicked" >> "$GITHUB_ENV"
          echo "RAVEN_GUI_ROOT=$deps/raven" >> "$GITHUB_ENV"
          echo "FULMETRY_WICKED_SHADER_CACHE=$deps/wicked-shader-cache/" >> "$GITHUB_ENV"
          echo "MUJOCO_ROOT=$deps/mujoco" >> "$GITHUB_ENV"
          echo "key=$(python3 tools/fetch_dep.py key wicked)" >> "$GITHUB_OUTPUT"
          echo "mujoco-key=$(python3 tools/fetch_dep.py key mujoco)-linux-x86_64" >> "$GITHUB_OUTPUT"
      # The checkout and the build dir are cached together: tar keeps the engine's mtimes, so Ninja rebuilds only
      # what the fresh repo checkout touched. restore-keys lets a pin bump rebuild just the engine files it changed.
      - name: Restore Wicked build
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WICKED_ROOT }}
            build/ci-m1
          key: ${{ steps.dep.outputs.key }}-m1-build-v1
          restore-keys: wicked-
      - name: Restore shader cache
        id: shader-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FULMETRY_WICKED_SHADER_CACHE }}
          key: ${{ steps.dep.outputs.key }}-shaders-v1
      - uses: actions/cache@v4
        with:
          path: ${{ env.MUJOCO_ROOT }}
          key: ${{ steps.dep.outputs.mujoco-key }}
      - name: Fetch Wicked Engine, Raven and MuJoCo
        run: |
          python3 tools/fetch_dep.py fetch wicked "$WICKED_ROOT"
          python3 tools/fetch_dep.py fetch raven "$RAVEN_GUI_ROOT"
          python3 tools/fetch_dep.py fetch mujoco "$MUJOCO_ROOT"
      - name: Configure
        run: cmake --preset ci-m1
      - name: Build
        run: cmake --build --preset ci-m1
      # Saved before the tests, so a red test does not throw away a 15-minute engine build.
      - name: Save Wicked build
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WICKED_ROOT }}
            build/ci-m1
          key: ${{ steps.dep.outputs.key }}-m1-build-v1
      - name: Test
        id: test
        run: ctest --preset ci-m1
      - name: M1 workbench (Xvfb + lavapipe)
        # Five 1440 x 900 screenshots of the live stage, then X11 drags, a click that selects the camera head and
        # a wheel zoom; fails when the selection or the camera does not follow.
        run: app/ui/tests/m1_shots.sh build/ci-m1/app/ui/fulmetry_workbench build/ci-m1/m1-shots
      - name: Harness onboarding and picker (Xvfb + lavapipe)
        # Seven screenshots of the onboarding screen's states and the picker, then a real click on the harness chip.
        run: app/ui/tests/harness_shots.sh build/ci-m1/app/ui/fulmetry_workbench build/ci-m1/m1-shots/harnesses
      - name: Simulate drive test (Xvfb + lavapipe + MuJoCo)
        # Three screenshots of the living-room drive test, then W held in a real window and Esc to stop.
        run: app/ui/tests/sim_shots.sh build/ci-m1/app/ui/fulmetry_workbench build/ci-m1/m1-shots/simulate
      - name: Save shader cache
        if: always() && steps.test.outcome == 'success' && steps.shader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FULMETRY_WICKED_SHADER_CACHE }}
          key: ${{ steps.dep.outputs.key }}-shaders-v1
      - name: Upload M1 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-screenshots
          path: build/ci-m1/m1-shots/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wicked-render
          path: |
            build/ci-m1/app/viewport/rover-wicked.png
            build/ci-m1/golden-diffs/
            build/ci-m1/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  raven-gui:
    # S5's Raven GUI: every ctest under Xvfb on lavapipe, then the spike's headless smoke run (types into the
    # composer, scrolls, takes screenshots). About 5 minutes; Raven's checkout takes seconds, so it is not cached.
    # It builds the M1 workbench without Wicked (the still-image stage); the Wicked job builds it with the live one.
    name: app (ubuntu-24.04, Raven GUI)
    needs: changes
    if: needs.changes.outputs.raven == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      RAVEN_WINDOW_SYSTEM: x11
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth xdotool imagemagick \
            ninja-build
      - name: Fetch Raven
        run: |
          echo "RAVEN_GUI_ROOT=$(realpath -m "$GITHUB_WORKSPACE/../deps/raven")" >> "$GITHUB_ENV"
          python3 tools/fetch_dep.py fetch raven "$(realpath -m "$GITHUB_WORKSPACE/../deps/raven")"
      - name: Configure
        run: cmake --preset ci-raven
      - name: Build
        run: cmake --build --preset ci-raven
      - name: Test
        # Any ui test S5 adds gets a display here; today that is the fakes suite against the Raven-enabled build.
        run: xvfb-run -a -s "-screen 0 1440x900x24" ctest --preset ci-raven
      - name: Smoke (spike under Xvfb)
        shell: bash
        run: |
          mkdir -p build/ci-raven/smoke
          app/ui/spike/run_headless.sh build/ci-raven/app/ui/spike/raven_spike build/ci-raven/smoke/raven-spike.png \
            | tee build/ci-raven/smoke/raven-spike.log
          grep -q "frames measured" build/ci-raven/smoke/raven-spike.log
          grep -q 'composer committed: "Make the wheels 70 mm"' build/ci-raven/smoke/raven-spike.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raven-gui-smoke
          path: build/ci-raven/smoke/
          if-no-files-found: ignore
          retention-days: 14
