[package]
name = "fulmetry-cad"
description = "Builds Fulmetry part models with SolidCraft's B-rep kernel from sandboxed Rhai part scripts"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[[bin]]
name = "fulmetry-cad"
path = "src/main.rs"

[dependencies]
# SolidCraft's kernel crate (MIT OR Apache-2.0) on solidcore (Apache-2.0). Pinned: both move fast.
solidcraft-kernel = { git = "https://github.com/tangency-labs/solidcraft", rev = "9325e3ac8cc1dcad67bc5d218274e89e8a9b26fc" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "f5e8e9a29e0c9b7cf6c4040a5bc8878382b3c62f" }
rhai = { version = "1.23", features = ["sync", "serde", "no_custom_syntax"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
