[project]
name = "fulmetry-worker"
version = "0.0.1"
description = "Fulmetry engine worker: build123d, KiCad, slicers, PlatformIO, Gmsh/CalculiX, MJX behind JSON-RPC"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
test = ["pytest>=8"]
cad = ["build123d>=0.9"]

[project.scripts]
fulmetry-worker = "fulmetry_worker.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fulmetry_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
